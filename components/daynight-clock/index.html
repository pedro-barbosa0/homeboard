<!-- Day & night sky: a pixel-art clock. The sun and the moon cross the sky with the real time; the sky changes colour
     at dawn, day, dusk and night, stars come out, and the time is written in blocky digits. Redrawn only when the
     minute changes (or the card is resized). -->
<style>
  html, body { background: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; border-radius: var(--radius, 12px); }
</style>
<canvas id="sky"></canvas>
<script>
  const cv = document.getElementById('sky'), g = cv.getContext('2d');
  const P = 4;                                   // one "pixel" of the art, in screen pixels
  // sky colours through the day: [hour, top, bottom]
  const SKY = [[0, '#0b1030', '#1b2350'], [5, '#1d2150', '#5a3d6e'], [6.5, '#f08a5d', '#ffd29a'], [8, '#5fb2ff', '#bfe6ff'],
               [17, '#4fa3f0', '#cde9ff'], [19, '#f26b5b', '#ffc58a'], [20.5, '#2a2a66', '#6a4a7c'], [22, '#0b1030', '#1b2350'], [24, '#0b1030', '#1b2350']];
  const mix = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), x = p(a), y = p(b); return 'rgb(' + x.map((v, j) => Math.round(v + (y[j] - v) * k)).join(',') + ')'; };
  function skyAt(h) {
    for (let i = 0; i < SKY.length - 1; i++) if (h >= SKY[i][0] && h < SKY[i + 1][0]) {
      const k = (h - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0]);
      return [mix(SKY[i][1], SKY[i + 1][1], k), mix(SKY[i][2], SKY[i + 1][2], k)];
    }
    return [SKY[0][1], SKY[0][2]];
  }
  // 3x5 blocky digits
  const DIG = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111',
    6: '111100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001111', ':': '000010000010000' };
  const rnd = s => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };
  function draw(now) {
    const W = Math.ceil(innerWidth / P), H = Math.ceil(innerHeight / P);
    cv.width = W; cv.height = H;
    const h = now.getHours() + now.getMinutes() / 60, [top, bottom] = skyAt(h);
    const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, top); grad.addColorStop(1, bottom);
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    const night = h < 6 || h > 20.5;
    if (night || h < 6.8 || h > 19.5) for (let i = 0; i < 60; i++) {         // stars, the same ones every night
      g.fillStyle = `rgba(255,255,255,${(night ? .9 : .35) * (.4 + rnd(i * 7) * .6)})`;
      g.fillRect(Math.floor(rnd(i) * W), Math.floor(rnd(i + 99) * H * .6), 1, 1);
    }
    // the sun by day, the moon by night, on an arc from left to right
    const cx = W / 2, cy = H * .78, R = Math.min(W * .44, H * .62);
    const body = (t, draw) => { const a = Math.PI * (1 - t); draw(Math.round(cx + Math.cos(a) * R), Math.round(cy - Math.sin(a) * R)); };
    if (h >= 6 && h <= 20) body((h - 6) / 14, (x, y) => {
      g.fillStyle = '#ffe066'; g.fillRect(x - 3, y - 3, 7, 7); g.fillStyle = '#fff3b0'; g.fillRect(x - 2, y - 2, 5, 5);
      g.fillStyle = 'rgba(255,224,102,.35)'; g.fillRect(x - 5, y - 1, 11, 3); g.fillRect(x - 1, y - 5, 3, 11);
    });
    else body(((h + 24 - 20) % 24) / 10, (x, y) => {
      g.fillStyle = '#e8ecff'; g.fillRect(x - 3, y - 3, 6, 6); g.fillStyle = top; g.fillRect(x, y - 3, 3, 3);   // a crescent
    });
    // hills in blocks, darker at night
    const shade = night ? .35 : h < 7.5 || h > 18.5 ? .7 : 1;
    for (let x = 0; x < W; x++) {
      const y1 = Math.floor(H * .78 + Math.sin(x * .09) * 3 + Math.sin(x * .023) * 5);
      g.fillStyle = `rgb(${Math.round(70 * shade)},${Math.round(150 * shade)},${Math.round(70 * shade)})`; g.fillRect(x, y1, 1, 2);
      g.fillStyle = `rgb(${Math.round(110 * shade)},${Math.round(80 * shade)},${Math.round(55 * shade)})`; g.fillRect(x, y1 + 2, 1, H - y1);
    }
    // the time, in blocky digits with a shadow
    const text = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const s = Math.max(1, Math.floor(Math.min(W / 24, H / 14))), tw = text.length * 4 * s - s, tx = Math.floor((W - tw) / 2), ty = Math.floor(H * .14);
    for (const [ox, oy, col] of [[1, 1, 'rgba(0,0,0,.45)'], [0, 0, '#ffffff']]) {
      g.fillStyle = col;
      [...text].forEach((ch, i) => { const m = DIG[ch]; for (let p = 0; p < 15; p++) if (m[p] === '1') g.fillRect(tx + i * 4 * s + (p % 3) * s + ox * s, ty + Math.floor(p / 3) * s + oy * s, s, s); });
    }
  }
  let last = '';
  homeboard.on('time', now => { const k = now.getHours() + ':' + now.getMinutes(); if (k !== last) { last = k; draw(now); } });
  homeboard.on('size', () => draw(new Date()));
</script>
