<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Homeboard">
  <!-- Homeboard's mark: a chunky, friendly little board-computer with a carry handle (a nod to the rugged school
       laptops of the late 2000s), its screen holding the cards of a board, and a navigator's star. See docs/brand. -->
  <defs>
    <linearGradient id="hb-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B86F0"/>
      <stop offset=".55" stop-color="#1F63D2"/>
      <stop offset="1" stop-color="#174BA8"/>
    </linearGradient>
    <linearGradient id="hb-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16326A"/>
      <stop offset="1" stop-color="#0C1F47"/>
    </linearGradient>
  </defs>
  <!-- the carry handle -->
  <path fill="#174BA8" fill-rule="evenodd" d="M50 3h28a13 13 0 0 1 13 13v14H37V16A13 13 0 0 1 50 3Zm3 9a5 5 0 0 0-5 5v6h32v-6a5 5 0 0 0-5-5Z"/>
  <!-- the shell -->
  <rect x="7" y="22" width="114" height="102" rx="27" fill="url(#hb-shell)"/>
  <path d="M34 26h60a23 23 0 0 1 23 23v2H11v-2a23 23 0 0 1 23-23Z" fill="#fff" opacity=".13"/>
  <!-- the white bezel and the screen -->
  <rect x="18" y="34" width="92" height="70" rx="16" fill="#F4F7FB"/>
  <rect x="25" y="41" width="78" height="56" rx="10" fill="url(#hb-screen)"/>
  <!-- the cards of a board -->
  <rect x="32" y="48" width="29" height="19" rx="5" fill="#FFC93C"/>
  <rect x="66" y="48" width="30" height="27" rx="5" fill="#8EC5FF"/>
  <rect x="32" y="71" width="29" height="19" rx="5" fill="#39C27F"/>
  <rect x="66" y="79" width="30" height="11" rx="5" fill="#FF6B5E"/>
  <!-- the navigator's star -->
  <path d="M64 107.5l2.4 6.1 6.1 2.4-6.1 2.4-2.4 6.1-2.4-6.1-6.1-2.4 6.1-2.4Z" fill="#F4F7FB"/>
</svg>
